name: Build moss-comfyui worker

# Builds runpod-workers/worker-comfyui at an upstream tag with COMFYUI_VERSION
# overridden, then proves the MOSS node classes are present in the pushed image.
#
# Why: worker-comfyui 5.11.0 pins COMFYUI_VERSION=0.34.0. MOSS-Image core support
# landed in 0.42.0 and the edit LoRAs (TextEncodeMOSSImageEdit) in 0.43.0, so the
# stock worker image cannot run any MOSS graph. One build arg fixes it.
#
# Registry: GHCR, authenticated with the run's own GITHUB_TOKEN — no Docker Hub
# account and no repo secrets required. Runpod pulls a public GHCR package
# anonymously; flip the package to public once after the first push.

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      comfyui_version:
        description: ComfyUI version to bake in
        default: "0.43.0"
        required: true
      worker_tag:
        description: Upstream worker-comfyui tag
        default: "5.11.0"
        required: true
      verify_only:
        description: Skip the build and re-run only the image assertions
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  COMFYUI_VERSION: ${{ inputs.comfyui_version || '0.43.0' }}
  WORKER_TAG: ${{ inputs.worker_tag || '5.11.0' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/moss-comfyui

jobs:
  build:
    # verify_only re-checks an image that was already pushed
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream worker
        run: |
          git clone --depth 1 --branch "${WORKER_TAG}" \
            https://github.com/runpod-workers/worker-comfyui upstream
          echo "upstream $(git -C upstream rev-parse --short HEAD)"
          grep -n '^ARG COMFYUI_VERSION' upstream/Dockerfile

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # the upstream tree IS the build context (its Dockerfile ADDs handler.py,
          # src/start.sh, scripts/*), so point both context and file at it
          context: ./upstream
          file: ./upstream/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMFYUI_VERSION=${{ env.COMFYUI_VERSION }}
            CUDA_VERSION_FOR_COMFY=12.8
          tags: |
            ${{ env.IMAGE }}:${{ env.COMFYUI_VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # mode=min: the CUDA+torch layers are huge and a max cache blows the
          # runner's disk a second time during the export
          cache-to: type=gha,mode=min

  verify:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pushed image
        run: docker pull "${IMAGE}:${COMFYUI_VERSION}"

      - name: ComfyUI version baked in
        run: >-
          docker run --rm --entrypoint sh "${IMAGE}:${COMFYUI_VERSION}"
          -c 'cat comfyui_version.py; grep -q "__version__ = \"${COMFYUI_VERSION}\"" comfyui_version.py'

      - name: MOSS edit nodes present (static; import needs a GPU driver)
        run: >-
          docker run --rm -w /comfyui --entrypoint sh "${IMAGE}:${COMFYUI_VERSION}" -c '
          set -e;
          test -f comfy_extras/nodes_moss_image.py;
          grep -q "class TextEncodeMOSSImageEdit" comfy_extras/nodes_moss_image.py;
          grep -q "class MOSSImageControl" comfy_extras/nodes_moss_image.py;
          echo "MOSS nodes present";
          '

      - name: moss_image CLIP type registered
        run: >-
          docker run --rm -w /comfyui --entrypoint sh "${IMAGE}:${COMFYUI_VERSION}"
          -c 'grep -rl "moss_image" --include=*.py comfy | head -5'
